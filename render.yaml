services:
  - type: web
    name: nail-boutique
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: node --check server.cjs
    startCommand: node server.cjs
    healthCheckPath: /health
    disk:
      name: nail-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/nail.sqlite
      - key: SETUP_KEY
        generateValue: true
